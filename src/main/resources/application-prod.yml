spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

ticker:
  seeder:
    enabled: ${TICKER_SEEDER_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.rods.backtestingstrategies: ${APP_LOG_LEVEL:INFO}
