spring:
  application:
    name: BacktestingStrategies
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-migration-naming: true

ticker:
  seeder:
    enabled: ${TICKER_SEEDER_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    basedir: ${java.io.tmpdir}/tomcat

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

market-data:
  yahoo:
    base-uri: ${YAHOO_BASE_URI:https://query1.finance.yahoo.com}
    connect-timeout: ${YAHOO_CONNECT_TIMEOUT:3s}
    response-timeout: ${YAHOO_RESPONSE_TIMEOUT:10s}
    request-timeout: ${YAHOO_REQUEST_TIMEOUT:15s}
    user-agent: ${YAHOO_USER_AGENT:BacktestingStrategies/phase-2 educational-validation}
  retry:
    max-attempts: ${YAHOO_MAX_ATTEMPTS:3}
    initial-backoff: ${YAHOO_INITIAL_BACKOFF:250ms}
    max-backoff: ${YAHOO_MAX_BACKOFF:3s}
  freshness:
    close-grace: ${MARKET_DATA_CLOSE_GRACE:20m}
    correction-overlap-days: ${MARKET_DATA_CORRECTION_OVERLAP_DAYS:5}
